[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# CSS et JS sans nom versionné : le navigateur revalide à chaque visite (sinon il garde l'ancienne mise en page)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# Pages retirées le 2 nov. 2026 : on renvoie vers l'accueil plutôt qu'un 404
[[redirects]]
  from = "/services/shooting.html"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/services/etalonnage.html"
  to = "/#services"
  status = 301
